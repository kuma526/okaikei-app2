[project]
name = "kantaro-app"
version = "1.0.0"
description = "勘太郎 ver. 1.0 - 個人事業主向け 出納帳 Webアプリケーション"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
kantaro = "backend.app:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
